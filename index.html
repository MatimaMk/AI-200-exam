<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-200 Practice</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #ffffff; --ink: #201f1e; --muted: #605e5c; --line: #e1dfdd; --subtle: #f3f2f1;
  --primary: #0078d4; --primary-dark: #005a9e; --primary-ink: #ffffff; --primary-soft: #eff6fc;
  --good: #107c10; --good-soft: #dff6dd; --bad: #a4262c; --bad-soft: #fde7e9; --flag: #ffb900;
  --focus: #000000; --acc: #0078d4;
  --shadow: 0 1.6px 3.6px rgba(0,0,0,.13), 0 0.3px 0.9px rgba(0,0,0,.1);
}
html { color-scheme: light; scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: var(--ink); font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px; line-height: 1.5; }
main { max-width: 960px; margin: 0 auto; padding: 28px 20px 72px; }
main.wide { max-width: 1120px; }
h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); line-height: 1.2; margin: 0 0 10px; font-weight: 600; }
h2 { font-size: 1.25rem; margin: 0; font-weight: 600; }
p { margin: 0; }
.lead { color: var(--muted); max-width: 60ch; font-size: 1.05rem; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code { font-family: Consolas, "Cascadia Mono", ui-monospace, Menlo, monospace; font-size: .9em; background: var(--subtle); padding: 1px 5px; border-radius: 3px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: #fff; border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.05rem; }
.badge { background: var(--primary); color: #fff; font-weight: 700; padding: 2px 8px; border-radius: 2px; font-size: .95rem; }
.disc { color: var(--muted); font-size: .82rem; text-align: right; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 4px; }
.btn { border: 1px solid var(--primary); background: var(--primary); color: var(--primary-ink); padding: 9px 20px; border-radius: 2px; font-weight: 600; min-height: 40px; }
.btn:hover:not([disabled]) { background: var(--primary-dark); border-color: var(--primary-dark); }
.btn.ghost { background: #fff; color: var(--ink); border-color: #8a8886; }
.btn.ghost:hover:not([disabled]) { background: var(--subtle); border-color: #605e5c; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.hero2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; align-items: stretch; padding: 8px 0 8px; }
.hl { padding: 8px 0; }
.facts { display: flex; flex-wrap: wrap; margin: 18px 0 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 2px; width: fit-content; max-width: 100%; }
.facts li { padding: 8px 16px; border-right: 1px solid var(--line); font-size: .92rem; color: var(--muted); }
.facts li:last-child { border-right: 0; }
.facts b { color: var(--ink); font-size: 1.15rem; margin-right: 4px; }
.ready { background: var(--subtle); border-radius: 4px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.ringrow { display: flex; align-items: center; gap: 16px; }
.ring { --p: 0; flex: none; width: 92px; height: 92px; border-radius: 50%; background: conic-gradient(var(--primary) calc(var(--p) * 1%), #d2d0ce 0); display: grid; place-items: center; position: relative; }
.ring::after { content: ""; position: absolute; inset: 10px; background: var(--subtle); border-radius: 50%; }
.ring span { position: relative; z-index: 1; font-weight: 700; font-size: 1.3rem; }
.ready h2 { font-size: 1.05rem; }
.ready .small { font-size: .88rem; color: var(--muted); }
.drow { display: flex; justify-content: space-between; font-size: .88rem; font-weight: 600; margin-bottom: 4px; }
.mini { height: 6px; background: #d2d0ce; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
.mini > i { display: block; height: 100%; background: var(--acc); }

.domain { margin-top: 38px; }
.domain-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 2px; }
.weight { color: var(--muted); font-size: .9rem; }
.domain-note { color: var(--muted); font-size: .95rem; margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.topic { text-align: left; background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--acc); border-radius: 4px; padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
.topic:hover { box-shadow: 0 6.4px 14.4px rgba(0,0,0,.18), 0 1.2px 3.6px rgba(0,0,0,.12); }
.topic strong { font-size: 1.02rem; font-weight: 600; }
.topic .blurb { color: var(--muted); font-size: .9rem; line-height: 1.4; flex: 1; }
.topic .meta { font-size: .85rem; color: var(--muted); }
.fmt { border-top-color: var(--primary); }
.ico { width: 34px; height: 34px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); border-radius: 4px; font-size: 1.2rem; font-weight: 700; margin-bottom: 2px; }
.bar { height: 6px; background: var(--subtle); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--acc); }

.back { background: none; border: 0; color: var(--primary); font-weight: 600; padding: 6px 0; margin-bottom: 8px; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: .95rem; flex-wrap: wrap; }
.qtitle { font-weight: 600; color: var(--ink); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.05rem; }
.timer.low { color: #ffb4b8; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 22px 22px; margin-top: 14px; box-shadow: var(--shadow); }
.cardtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.pill { display: inline-block; font-size: .82rem; font-weight: 600; color: var(--primary-dark); background: var(--primary-soft); border: 1px solid #c7e0f4; padding: 1px 10px; border-radius: 2px; margin-bottom: 10px; }
.cardtop .pill { margin-bottom: 0; }
.qtext { font-size: 1.15rem; font-weight: 600; line-height: 1.45; margin-bottom: 16px; }
.hint { color: var(--muted); font-size: .92rem; margin-bottom: 10px; }
.flagbtn { background: #fff; border: 1px solid #8a8886; border-radius: 2px; padding: 4px 12px; font-size: .88rem; font-weight: 600; }
.flagbtn.on { background: #fff4ce; border-color: var(--flag); }

.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; }
.opt:hover:not([disabled]) { background: var(--subtle); border-color: #c8c6c4; }
.rad, .chk { flex: none; width: 20px; height: 20px; margin-top: 1px; border: 2px solid #605e5c; background: #fff; display: grid; place-items: center; font-size: .8rem; font-weight: 800; color: #fff; }
.rad { border-radius: 50%; }
.chk { border-radius: 3px; }
.rad.on { border-color: var(--primary); box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 20px var(--primary); }
.chk.on { background: var(--primary); border-color: var(--primary); }
.ltr { flex: none; font-weight: 600; color: var(--muted); width: 18px; }
.otx { flex: 1; min-width: 0; }
.tag { margin-left: auto; font-weight: 700; font-size: .85rem; white-space: nowrap; padding-left: 8px; }
.opt.sel { border-color: var(--primary); background: var(--primary-soft); }
.opt.correct, .oi.correct, .slot.correct { border-color: var(--good); background: var(--good-soft); }
.opt.wrong, .oi.wrong, .slot.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.missed { border: 1px dashed var(--good); }
.opt.correct .tag, .oi.correct .tag, .slot.correct .tag, .opt.missed .tag { color: var(--good); }
.opt.wrong .tag, .oi.wrong .tag, .slot.wrong .tag { color: var(--bad); }
.opt[disabled] { cursor: default; }

.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.oi { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; }
.oi[draggable="true"] { cursor: grab; }
.grip { color: #a19f9d; letter-spacing: -2px; font-weight: 800; }
.num { flex: none; width: 24px; height: 24px; background: var(--primary); color: #fff; border-radius: 2px; display: grid; place-items: center; font-weight: 700; font-size: .82rem; }
.txt { flex: 1; min-width: 0; }
.mv { display: flex; gap: 6px; }
.sq { width: 34px; height: 34px; border-radius: 2px; border: 1px solid #8a8886; background: #fff; font-weight: 700; }
.sq:hover:not([disabled]) { background: var(--subtle); }
.sq[disabled] { opacity: .35; cursor: default; }

.mrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 8px; }
.mleft { font-weight: 600; background: var(--subtle); padding: 10px 12px; border-radius: 2px; }
.slot { width: 100%; min-height: 44px; text-align: left; border: 1px dashed #8a8886; border-radius: 2px; background: #fff; padding: 8px 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.slot.filled { border-style: solid; border-color: var(--primary); background: var(--primary-soft); color: var(--ink); font-weight: 600; }
.slot.correct, .slot.wrong { border-style: solid; color: var(--ink); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border: 1px dashed #c8c6c4; background: var(--subtle); border-radius: 2px; margin-top: 8px; min-height: 56px; }
.chip { background: #fff; border: 1px solid var(--primary); color: var(--primary-dark); border-radius: 2px; padding: 6px 12px; font-weight: 600; cursor: grab; text-align: left; box-shadow: var(--shadow); }
.chip.picked { background: var(--primary); color: #fff; }

details.case { margin: 4px 0 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--subtle); padding: 10px 14px; }
pre.code { background: var(--subtle); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; overflow-x: auto; font-family: Consolas, "Cascadia Mono", ui-monospace, Menlo, monospace; font-size: .86rem; line-height: 1.5; margin: 0 0 14px; white-space: pre; }
.sel-rows { display: grid; gap: 10px; }
.sel-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; }
.sel-row select { font: inherit; width: 100%; padding: 7px 8px; border: 1px solid #8a8886; border-radius: 2px; background: #fff; color: var(--ink); }
.sel-row.correct { border-color: var(--good); background: var(--good-soft); }
.sel-row.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ynbox { display: flex; gap: 10px; justify-content: flex-end; }
.ynopt { display: inline-flex; align-items: center; gap: 8px; border: 1px solid #8a8886; border-radius: 2px; padding: 7px 14px; background: #fff; cursor: pointer; min-width: 84px; }
.ynopt input { margin: 0; width: 18px; height: 18px; accent-color: var(--primary); }
.ynopt.on { border-color: var(--primary); background: var(--primary-soft); font-weight: 600; }
.sel-row.yn { grid-template-columns: minmax(0, 1fr) auto; }
@media (max-width: 640px) { .ynbox { justify-content: flex-start; } }
.sel-row .fix { grid-column: 1 / -1; font-size: .88rem; color: var(--muted); }
@media (max-width: 640px) { .sel-row { grid-template-columns: 1fr; } }
.lenpick { display: flex; flex-direction: column; gap: 4px; margin: 18px 0 0; max-width: 280px; }
.lenpick label { font-size: .85rem; font-weight: 600; color: var(--muted); }
.lenpick select { font: inherit; padding: 9px 10px; border: 1px solid #8a8886; border-radius: 2px; background: #fff; color: var(--ink); }
body.proctor { background: #fff; }
body.proctor header.top { display: none; }
body.proctor main#app { max-width: none; padding: 0; }
.px-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; background: #243a5e; color: #fff; padding: 10px 24px; }
.px-title { font-weight: 600; font-size: 1rem; }
.px-title small { display: block; font-weight: 400; font-size: .8rem; opacity: .8; }
.px-meta { display: flex; gap: 24px; align-items: center; font-size: .95rem; flex-wrap: wrap; }
.px-time { display: inline-flex; gap: 8px; align-items: center; }
.px-time .timer { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.px-time .timer.low { color: #ffb4b4; }
.px-time.hid .timer { visibility: hidden; }
.px-time .px-link { color: #c7e0f4; }
.px-link { background: none; border: 0; padding: 0; color: var(--primary); text-decoration: underline; font: inherit; cursor: pointer; }
.px-body { display: block; min-height: calc(100vh - 140px); padding: 28px 24px 110px; }
.px-body.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 0; padding: 0 0 90px; }
.px-case { border-right: 1px solid var(--line); padding: 20px 24px; background: #faf9f8; max-height: calc(100vh - 130px); overflow-y: auto; position: sticky; top: 64px; }
.px-case h2 { font-size: 1.1rem; margin: 8px 0; }
.px-case p, .px-case li { font-size: .92rem; line-height: 1.55; }
.px-case ul { padding-left: 20px; }
.px-tab { display: inline-block; background: #243a5e; color: #fff; font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 2px; }
.px-body.split .px-main { padding: 24px 28px; }
.px-main { max-width: 980px; margin: 0 auto; }
.px-main .qtext { font-weight: 400; font-size: 1.05rem; line-height: 1.6; }
.px-note { color: var(--muted); font-size: .92rem; margin: 10px 0 16px; }
.px-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #f3f2f1; border-top: 1px solid #c8c6c4; padding: 10px 24px calc(10px + env(safe-area-inset-bottom, 0px)); }
.px-sp { flex: 1; }
.px-btn { border: 1px solid #8a8886; background: #fff; color: var(--ink); padding: 8px 18px; border-radius: 2px; font-weight: 600; min-height: 38px; }
.px-btn:hover:not([disabled]) { background: #edebe9; }
.px-btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.px-btn.primary:hover:not([disabled]) { background: var(--primary-dark); }
.px-btn.on { background: #243a5e; border-color: #243a5e; color: #fff; }
.px-btn[disabled] { opacity: .45; cursor: not-allowed; }
.px-mark { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
.px-mark input { width: 18px; height: 18px; accent-color: #c43e00; }
.px-intro h1 { font-size: 1.8rem; margin-bottom: 8px; }
.px-intro h2 { font-size: 1.15rem; margin: 22px 0 6px; }
.px-intro li { margin: 6px 0; }
.px-facts { border-collapse: collapse; margin-top: 14px; }
.px-facts th, .px-facts td { text-align: left; padding: 8px 18px 8px 0; border-bottom: 1px solid var(--line); }
.px-facts th { font-weight: 600; color: var(--muted); }
.px-h { font-size: 1.5rem; margin-bottom: 4px; }
.px-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.px-table { width: 100%; border-collapse: collapse; }
.px-table th { text-align: left; background: #f3f2f1; font-weight: 600; padding: 9px 12px; border-bottom: 2px solid #c8c6c4; }
.px-table td { padding: 8px 12px; border-bottom: 1px solid var(--line); }
.px-inc { color: var(--bad); font-weight: 600; }
.px-modal { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); display: grid; place-items: center; padding: 20px; }
.px-dialog { background: #fff; max-width: 460px; width: 100%; padding: 22px 24px; border-top: 4px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.px-dialog h2 { font-size: 1.2rem; margin-bottom: 8px; }
.px-dialog p { margin: 8px 0; }
.px-dbtn { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
@media (max-width: 820px) { .px-body.split { grid-template-columns: 1fr; } .px-case { position: static; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); } .px-top { padding: 8px 14px; } .px-body { padding: 18px 14px 130px; } .px-foot { padding: 8px 12px; } }
.login { max-width: 420px; margin: 40px auto; }
.login h1 { font-size: 1.6rem; margin-bottom: 6px; }
.login form { display: grid; gap: 14px; margin-top: 18px; }
.login label { display: grid; gap: 4px; font-weight: 600; font-size: .92rem; }
.login input:not([type=checkbox]) { font: inherit; font-weight: 400; padding: 9px 10px; border: 1px solid #8a8886; border-radius: 2px; }
.login .keep { display: flex; align-items: center; gap: 8px; font-weight: 400; }
.loginerr { color: var(--bad); font-size: .9rem; min-height: 1.2em; margin: 0; }
.who { font-size: .85rem; color: var(--muted); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--primary); text-decoration: underline; font: inherit; cursor: pointer; }
details.case summary { cursor: pointer; font-weight: 600; }
details.case p, details.case li { font-size: .93rem; color: var(--muted); margin: 8px 0 0; }
details.case ul { padding-left: 20px; margin: 6px 0 0; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 0; font-size: .92rem; color: var(--muted); }
.bank button { border: 1px solid #8a8886; background: #fff; border-radius: 2px; padding: 5px 12px; }
.bank button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.explain { margin-top: 16px; padding: 14px 16px; border-radius: 2px; background: var(--primary-soft); border-left: 4px solid var(--primary); }
.explain > b { display: block; margin-bottom: 2px; }
.explain.good { background: var(--good-soft); border-left-color: var(--good); }
.explain.bad { background: var(--bad-soft); border-left-color: var(--bad); }
.explain.good > b { color: var(--good); }
.explain.bad > b { color: var(--bad); }
.ans { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,.12); }
.ans ul, .ans ol { margin: 4px 0 0; padding-left: 22px; }
.next { margin-top: 18px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

.xbar { background: #004578; color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 16px; border-radius: 4px; }
.xt { font-weight: 600; display: flex; flex-direction: column; line-height: 1.25; }
.xt small { font-weight: 400; opacity: .8; }
.xq { font-weight: 600; }
.xtime { font-size: .9rem; display: flex; align-items: center; gap: 8px; }
.xtime .timer { background: rgba(255,255,255,.15); padding: 2px 10px; border-radius: 2px; color: #fff; }
.xlayout { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 20px; align-items: start; }
.xside { margin-top: 14px; border: 1px solid var(--line); border-radius: 4px; padding: 14px; background: var(--subtle); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); }
.xside h2 { font-size: 1rem; }
.examnav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.examnav > div { display: flex; gap: 10px; }
.navg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.navb { width: 36px; height: 36px; border-radius: 2px; border: 1px solid #c8c6c4; background: #fff; font-weight: 600; position: relative; }
.navb.ans { background: var(--primary); border-color: var(--primary); color: #fff; }
.navb.flag::after { content: ""; position: absolute; top: 0; right: 0; border-top: 11px solid var(--flag); border-left: 11px solid transparent; }
.navb.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { list-style: none; margin: 12px 0 0; padding: 0; font-size: .85rem; color: var(--muted); display: grid; gap: 4px; }
.sw { display: inline-block; width: 12px; height: 12px; border: 1px solid #c8c6c4; background: #fff; margin-right: 8px; vertical-align: -1px; }
.sw.ans { background: var(--primary); border-color: var(--primary); }
.sw.flag { background: var(--flag); border-color: var(--flag); }
.confirm { margin-top: 14px; padding: 16px; border-radius: 2px; border-left: 4px solid var(--primary); background: var(--primary-soft); }

.result { text-align: center; padding: 30px 20px; }
.score { font-size: 3.4rem; font-weight: 600; line-height: 1.1; margin: 10px 0; color: var(--primary); }
.verdict { display: inline-block; font-weight: 700; padding: 4px 16px; border-radius: 2px; margin-bottom: 8px; }
.verdict.pass { background: var(--good-soft); color: var(--good); }
.verdict.fail { background: var(--bad-soft); color: var(--bad); }
.result .actions { justify-content: center; }
.brk { text-align: left; max-width: 540px; margin: 22px auto 0; }
.brow { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; font-size: .92rem; margin-top: 10px; }

<body>
<header class="top"><div class="top-in"><button class="brand" id="brand" aria-label="Go to the start page"><span class="badge">AI-200</span><span>Practice tests</span></button><span class="disc">Unofficial practice site. Not affiliated with Microsoft.</span></div></header>
<main id="app"></main>
<script src="questions.enc.js"></script>
<script>
/* ---------- login: decrypts questions.enc.js in the browser ---------- */
(function () {
  const app = document.getElementById("app"), KEEP = "ai200-session-v1";
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const tob64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const enc = new TextEncoder();
  async function sha256hex(t) { const h = await crypto.subtle.digest("SHA-256", enc.encode(t)); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join(""); }
  async function openBank(rawKey) {
    const B = window.ENC_BANK, key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(B.iv) }, key, b64(B.data));
    const data = JSON.parse(new TextDecoder().decode(plain));
    window.PRIVATE_CASES = data.cases; window.PRIVATE_QUESTIONS = data.questions;
  }
  async function unlock(user, pass) {
    const B = window.ENC_BANK, id = await sha256hex(B.userSalt + ":" + user), u = B.users[id];
    if (!u) throw new Error("bad");
    const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    const kek = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(u.salt), iterations: B.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(u.iv) }, kek, b64(u.wk)));
  }
  function signedIn(user) {
    const top = document.querySelector(".top-in"), btn = document.createElement("span");
    btn.className = "who"; btn.innerHTML = `Signed in as <b></b> · <button class="linkbtn" id="signout">Sign out</button>`;
    btn.querySelector("b").textContent = user; top.appendChild(btn);
    document.getElementById("signout").addEventListener("click", () => { try { localStorage.removeItem(KEEP); } catch (e) {} location.reload(); });
    window.startApp();
  }
  function showLogin(msg) {
    app.innerHTML = `<div class="card login"><h1>Sign in</h1><p class="muted">This practice site is private. Use the username and password you were given.</p>
      <form id="loginForm" autocomplete="on"><label>Username<input id="lu" name="username" autocomplete="username" required></label>
      <label>Password<input id="lp" name="password" type="password" autocomplete="current-password" required></label>
      <label class="keep"><input type="checkbox" id="lk"> Keep me signed in on this device</label>
      <p class="loginerr" id="lerr" role="alert">${msg || ""}</p><button class="btn" id="lbtn" type="submit">Sign in</button></form></div>`;
    document.getElementById("lu").focus();
    document.getElementById("loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      const user = document.getElementById("lu").value.trim().toLowerCase(), pass = document.getElementById("lp").value, btn = document.getElementById("lbtn"), err = document.getElementById("lerr");
      btn.disabled = true; btn.textContent = "Checking…"; err.textContent = "";
      try {
        const raw = await unlock(user, pass); await openBank(raw);
        if (document.getElementById("lk").checked) { try { localStorage.setItem(KEEP, JSON.stringify({ u: user, k: tob64(raw) })); } catch (e2) {} }
        signedIn(user);
      } catch (e3) { btn.disabled = false; btn.textContent = "Sign in"; err.textContent = "The username or password is incorrect, or your access has been removed."; }
    });
  }
  window.addEventListener("DOMContentLoaded", async () => {
    if (!window.ENC_BANK) { app.innerHTML = `<div class="card"><h2>No questions loaded</h2><p class="muted" style="margin-top:8px">The file <code>questions.enc.js</code> is missing. Upload it next to <code>index.html</code>.</p></div>`; return; }
    let saved = null; try { saved = JSON.parse(localStorage.getItem(KEEP) || "null"); } catch (e) {}
    if (saved) { try { await openBank(b64(saved.k)); return signedIn(saved.u); } catch (e) { try { localStorage.removeItem(KEEP); } catch (e2) {} return showLogin("Your access has changed. Please sign in again."); } }
    showLogin();
  });
})();
</script>

<script>
window.startApp = function () {
/* Questions are loaded from private-questions.js. */
const M = (id, q, o, c, e) => ({ id, type: "multi", q, o, c, e });
const O = (id, q, items, e) => ({ id, type: "order", q, items, e });
const P = (id, q, pairs, extra, e) => ({ id, type: "match", q, pairs, extra: extra || [], e });

const FORMATS = {
  single: { name: "Multiple choice", blurb: "Pick the one best answer." },
  multi: { name: "Choose more than one", blurb: "Select every answer that applies." },
  order: { name: "Drag to order", blurb: "Put the steps in the right order." },
  match: { name: "Drag to match", blurb: "Match each item with its partner." },
  select: { name: "Select from lists", blurb: "Pick the right option in each row." }
};

const DOMAINS = [
{ name: "Containers", weight: "About 20–25% of the exam", note: "Building, storing and running container images on Azure.", topics: [
  { id: "acr", title: "Container images and Azure Container Registry", blurb: "Building, pulling and distributing images.", qs: [] },
  { id: "aca", title: "Azure Container Apps", blurb: "Scaling, revisions, jobs and secrets.", qs: [] },
  { id: "aks", title: "AKS and troubleshooting pods", blurb: "Common pod errors and Kubernetes helpers.", qs: [] }
] },
{ name: "Data for AI", weight: "About 25–30% of the exam (the biggest area)", note: "Databases, vector search, caching and messaging for AI apps.", topics: [
  { id: "cosmos", title: "Azure Cosmos DB for NoSQL", blurb: "Partition keys, point reads, vectors, change feed.", qs: [] },
  { id: "pg", title: "Azure Database for PostgreSQL", blurb: "pgvector, distance operators and indexes.", qs: [] },
  { id: "redis", title: "Azure Managed Redis", blurb: "Semantic caching, TTL, vector indexes, Entra sign-in.", qs: [] },
  { id: "events", title: "Events and messages", blurb: "Event Grid, Service Bus and Event Hubs.", qs: [] }
] },
{ name: "Using Azure services", weight: "Part of the data and integration areas", note: "Functions and calling AI services from your code.", topics: [
  { id: "func", title: "Azure Functions", blurb: "Triggers, bindings, Durable Functions, cold starts.", qs: [] },
  { id: "ai", title: "Calling AI services from code", blurb: "Retries, keyless access, streaming, API Management.", qs: [] }
] },
{ name: "Security and monitoring", weight: "About 20–25% of the exam", note: "Keeping solutions safe and finding out what went wrong.", topics: [
  { id: "sec", title: "Securing Azure solutions", blurb: "Managed identities, Key Vault, RBAC, private networking.", qs: [] },
  { id: "mon", title: "Monitoring and troubleshooting", blurb: "Tracing, KQL, alerts and sampling.", qs: [] }
] }
];

/* ---------- setup ---------- */
const CASES = window.PRIVATE_CASES || {};
const TOPICS = {}, ALL = [];
DOMAINS.forEach(d => d.topics.forEach(t => { TOPICS[t.id] = t; t.qs.forEach(q => { q.src = q.src || "original"; }); }));
(window.PRIVATE_QUESTIONS || []).forEach(q => { if (TOPICS[q.topic]) TOPICS[q.topic].qs.push(q); });
DOMAINS.forEach(d => d.topics.forEach(t => t.qs.forEach(q => { q.type = q.type || "single"; q.topic = t.id; ALL.push(q); })));
const QBYID = Object.fromEntries(ALL.map(q => [q.id, q]));
const HAS_IMPORTED = false; /* single question bank */
/* Official domain weights (midpoints). "Using Azure services" is an estimate. */
const DOMAIN_WEIGHT = { "Containers": 22.5, "Data for AI": 27.5, "Using Azure services": 25, "Security and monitoring": 22.5 };
const PASS = 70;

let store = { last: {}, missed: [], bestExam: null, bank: "all" };
try { const raw = localStorage.getItem("ai200-practice-v2"); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
if (!store.last) store.last = {};
store.bank = "all";
function inBank(q) { return store.bank === "all" || q.src === store.bank; }
function bankQs() { return ALL.filter(inBank); }
function topicQs(t) { return t.qs.filter(inBank); }
const LENGTHS = [10, 25, 50, 100, 0]; /* 0 = all questions */
function examSize() { const n = bankQs().length, len = store.examLen == null ? 50 : store.examLen; return len === 0 ? n : Math.min(len, n); }
function examMinutes() { return examSize() * 2; }
function topicStat(t) { const qs = topicQs(t); return { n: qs.length, c: qs.filter(q => store.last[q.id] === true).length, seen: qs.filter(q => q.id in store.last).length }; }
function save() { try { localStorage.setItem("ai200-practice-v2", JSON.stringify(store)); } catch (e) {} }

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const app = document.getElementById("app");
let run = null, timerId = null;
function clearTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

/* ---------- run engine ---------- */
function makeView(q) {
  if (q.type === "single" || q.type === "multi") return { perm: q.fixed ? q.o.map((_, i) => i) : shuffle(q.o.map((_, i) => i)) };
  if (q.type === "order") return { chips: shuffle(q.items.concat(q.extra || []).map((_, i) => i)) };
  if (q.type === "select") return {};
  return { chips: shuffle(q.pairs.map(p => p[1]).concat(q.extra || [])) };
}
function initAns(q, v) {
  if (q.type === "single") return null;
  if (q.type === "multi") return [];
  if (q.type === "order") return q.items.map(() => null);
  if (q.type === "select") return q.slots.map(() => null);
  return q.pairs.map(() => null);
}
function newRun(o) {
  const r = Object.assign({ i: 0, ans: [], view: [], checked: [], touched: [], flags: [], results: [], pts: [], sel: null, drag: null, screen: "q", confirming: false, focusId: null }, o);
  r.qs = o.ids.map(id => QBYID[id]);
  r.qs.forEach((q, i) => { r.view[i] = makeView(q); r.ans[i] = initAns(q, r.view[i]); r.checked[i] = false; r.touched[i] = false; });
  return r;
}
function isAnswered(i) {
  const q = run.qs[i], a = run.ans[i];
  if (q.type === "single") return a !== null;
  if (q.type === "multi") return a.length > 0;
  if (q.type === "order") return a.some(x => x !== null);
  return a.some(x => x !== null);
}
function points(i) {
  const q = run.qs[i], a = run.ans[i], v = run.view[i];
  if (q.type === "single") return { p: a !== null && v.perm[a] === (q.a || 0) ? 1 : 0, m: 1 };
  if (q.type === "multi") { const sel = a.map(k => v.perm[k]), good = sel.filter(x => q.c.includes(x)).length; return { p: Math.max(0, good - (sel.length - good)), m: q.c.length }; }
  if (q.type === "order") return { p: q.items.filter((_, k) => a[k] !== null && v.chips[a[k]] === k).length, m: q.items.length };
  if (q.type === "select") return { p: q.slots.filter((sl, k) => a[k] === sl.a).length, m: q.slots.length };
  return { p: q.pairs.filter((pr, k) => a[k] !== null && v.chips[a[k]] === pr[1]).length, m: q.pairs.length };
}
function grade(i) { const g = points(i); return g.p === g.m; }
function answerText(q) {
  if (q.type === "single") return "<p>" + q.o[q.a || 0] + "</p>";
  if (q.type === "multi") return "<ul>" + q.c.map(k => "<li>" + q.o[k] + "</li>").join("") + "</ul>";
  if (q.type === "order") return "<ol>" + q.items.map(t => "<li>" + t + "</li>").join("") + "</ol>";
  if (q.type === "select") return "<ul>" + q.slots.map(sl => "<li>" + sl.l + " → <b>" + sl.a + "</b></li>").join("") + "</ul>";
  return "<ul>" + q.pairs.map(p => "<li>" + p[0] + " → " + p[1] + "</li>").join("") + "</ul>";
}
function recordResult(q, ok) { store.last[q.id] = ok; recordMissed(q, ok); }
function recordMissed(q, ok) {
  if (ok) store.missed = store.missed.filter(id => id !== q.id);
  else if (!store.missed.includes(q.id)) store.missed.push(q.id);
}

/* ---------- rendering ---------- */
function mount(html, scroll) {
  const act = document.activeElement;
  const fid = (run && run.focusId) || (act && act.dataset && act.dataset.fid);
  app.classList.toggle("wide", !!(run && run.mode === "exam" && run.screen === "q"));
  document.body.classList.toggle("proctor", !!(run && run.mode === "exam" && ["intro", "q", "rev"].includes(run.screen)));
  app.innerHTML = html;
  if (fid) { const el = app.querySelector('[data-fid="' + fid + '"]'); if (el && !el.disabled) el.focus({ preventScroll: true }); }
  if (run) run.focusId = null;
  if (scroll) window.scrollTo(0, 0);
}

const ACC = ["#0078d4", "#5c2d91", "#008272", "#c43e00"];
const FICON = { single: "◉", multi: "☑", order: "⇅", match: "⇄", select: "▾" };
function domainPct(d) { let b = 0, n = 0; d.topics.forEach(t => { const st = topicStat(t); n += st.n; b += st.c; }); return n ? Math.round(b / n * 100) : 0; }

function home() {
  clearTimer(); run = null;
  if (!ALL.length) { mount(`<div class="card"><h2>No questions loaded</h2><p class="muted" style="margin-top:8px">Put <code>private-questions.js</code> in the same folder as <code>index.html</code>, then reload the page.</p></div>`, true); return; }
  const missed = store.missed.filter(id => QBYID[id]);
  const tot = DOMAINS.reduce((a, d) => { d.topics.forEach(t => { const st = topicStat(t); a.n += st.n; a.b += st.c; }); return a; }, { n: 0, b: 0 });
  const overall = tot.n ? Math.round(tot.b / tot.n * 100) : 0;
  const cnt = k => ALL.filter(q => k === "all" || q.src === k).length;
  const bank = HAS_IMPORTED ? `<div class="bank" role="group" aria-label="Question bank"><span>Question bank:</span>${[["all", "All"], ["original", "Original"], ["imported", "Imported"]].map(([k, l]) => `<button data-bank="${k}" aria-pressed="${store.bank === k}">${l} (${cnt(k)})</button>`).join("")}</div>` : "";
  let html = `
    <section class="hero2">
      <div class="hl">
        <h1>AI-200: Developing AI Cloud Solutions on Azure</h1>
        <p class="lead">Practise for the Azure AI Cloud Developer Associate exam. Sit a timed practice exam, or work through one topic at a time.</p>
        <ul class="facts"><li><b>${examSize()}</b>questions</li><li><b>${examMinutes()}</b>minutes</li><li><b>${PASS}%</b>to pass</li><li><b>${Object.keys(FORMATS).length}</b>question formats</li></ul>
        <div class="lenpick"><label for="examLen">Choose length</label><select id="examLen" data-len="1">${LENGTHS.filter(l => l === 0 || l < bankQs().length).map(l => `<option value="${l}" ${(store.examLen == null ? 50 : store.examLen) === l ? "selected" : ""}>${l === 0 ? "All questions (" + bankQs().length + ")" : l + " questions"}</option>`).join("")}</select></div>
        <div class="actions"><button class="btn" data-act="exam">Start a ${examSize()}-question exam</button><button class="btn ghost" data-act="study">Study questions and answers</button><button class="btn ghost" data-act="topics">Browse topics</button></div>${bank}
      </div>
      <div class="ready">
        <div class="ringrow"><div class="ring" style="--p:${overall}"><span>${overall}%</span></div>
          <div><h2>Your progress</h2><p class="small">Share of questions you got right the last time you answered them, in practice or in an exam.${store.bestExam != null ? " Best full exam: " + store.bestExam + "%." : ""}</p></div></div>
        <div>${DOMAINS.map((d, i) => `<div class="drow"><span>${d.name}</span><span>${domainPct(d)}%</span></div><div class="mini" style="--acc:${ACC[i]}"><i style="width:${domainPct(d)}%"></i></div>`).join("")}</div>
      </div>
    </section>
    <section class="domain"><div class="domain-head"><h2>Exams in order</h2></div>
      <p class="domain-note">Work through every question, 50 at a time, in the order of the question list. Timed at 2 minutes per question.</p><div class="grid">${examSets().map((st, k) => { const best = (store.bestSet || {})[k]; return `<button class="topic fmt" data-act="examset" data-set="${k}"><strong>Exam ${k + 1}</strong><span class="blurb">Questions ${st.from}–${st.to}</span><div class="bar" aria-hidden="true"><i style="width:${best || 0}%"></i></div><span class="meta">${st.ids.length} questions · ${st.ids.length * 2} minutes${best != null ? " · Best: " + best + "%" : ""}</span></button>`; }).join("")}</div></section>
    <section class="domain"><div class="domain-head"><h2>Practice by question format</h2></div>
      <p class="domain-note">Drill one format. You see feedback after every question.</p><div class="grid">`;
  Object.keys(FORMATS).forEach(f => {
    const n = bankQs().filter(q => q.type === f).length;
    html += `<button class="topic fmt" data-fmt="${f}"><span class="ico" aria-hidden="true">${FICON[f]}</span><strong>${FORMATS[f].name}</strong><span class="blurb">${FORMATS[f].blurb}</span><span class="meta">${n} questions</span></button>`;
  });
  html += `</div><div class="actions"><button class="btn ghost" data-act="mixed">Mixed quiz (20 questions)</button><button class="btn ghost" data-act="review" ${missed.length ? "" : "disabled"}>Review missed (${missed.length})</button></div></section>`;
  html += `<section class="domain" id="topics"><div class="domain-head"><h2>Practice by topic</h2></div><p class="domain-note">Questions are grouped by what they have in common.</p></section>`;
  DOMAINS.forEach((d, di) => {
    html += `<section class="domain" style="margin-top:22px;--acc:${ACC[di]}"><div class="domain-head"><h2>${d.name}</h2><span class="weight">${d.weight}</span></div><p class="domain-note">${d.note}</p><div class="grid">`;
    d.topics.forEach(t => {
      const st = topicStat(t), pct = st.n ? Math.round(st.c / st.n * 100) : 0;

function pickExam(n) {
  /* Split questions across domains by the official weights, then rotate through each domain's topics. */
  const ds = DOMAINS.map(d => ({ w: DOMAIN_WEIGHT[d.name] || 25, pools: d.topics.map(t => shuffle(topicQs(t))).filter(p => p.length) })).filter(x => x.pools.length);
  const total = ds.reduce((a, x) => a + x.w, 0);
  ds.forEach(x => { x.avail = x.pools.reduce((a, p) => a + p.length, 0); x.quota = Math.min(x.avail, Math.round(n * x.w / total)); });
  let diff = n - ds.reduce((a, x) => a + x.quota, 0);
  while (diff > 0) { const c = ds.filter(x => x.quota < x.avail).sort((a, b) => a.quota / a.w - b.quota / b.w)[0]; if (!c) break; c.quota++; diff--; }
  while (diff < 0) { const c = ds.filter(x => x.quota > 0).sort((a, b) => b.quota / b.w - a.quota / a.w)[0]; c.quota--; diff++; }
  const out = [];
  ds.forEach(x => {
    let taken = 0;
    for (let k = 0; taken < x.quota; k++) {
      let added = false;
      for (const p of shuffle(x.pools)) { if (k < p.length && taken < x.quota) { out.push(p[k]); taken++; added = true; } }
      if (!added) break;
    }
  });
  return shuffle(out).map(q => q.id);
}
/* Fixed exams in question order: 1-50, 51-100, 101-end. */
const SET_SIZE = 50;
function examSets() {

}

function renderStudy() {
  clearTimer(); run = null;
  const sets = examSets(), qs = bankQs().slice().sort((a, b) => (a.num || 0) - (b.num || 0));
  const pos = Object.fromEntries(qs.map((q, k) => [q.id, k + 1]));
  const setOf = Object.fromEntries(sets.flatMap((st, k) => st.ids.map(id => [id, "set" + k])));
  const filters = [["all", "All questions (" + qs.length + ")"]].concat(sets.map((st, k) => ["set" + k, `Exam ${k + 1}: questions ${st.from}–${st.to}`]),
    Object.values(TOPICS).filter(t => topicQs(t).length).map(t => ["t:" + t.id, t.title + " (" + topicQs(t).length + ")"]),
    Object.keys(FORMATS).filter(f => qs.some(q => q.type === f)).map(f => ["f:" + f, FORMATS[f].name]));
  const hide = !!store.studyHide;
  let html = `<button class="back" data-act="home">← Back to the start</button><h1 style="font-size:1.8rem">Study questions and answers</h1>
    <p class="lead">Every question with its correct answer and explanation. Turn on "Hide answers" to test yourself first.</p>
    <div class="studybar"><label>Show<select id="studyFilter">${filters.map(([v, l]) => `<option value="${v}" ${store.studyFilter === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    <label>Search<input type="search" id="studySearch" placeholder="Search words, e.g. Redis TTL"></label>
    <label class="chk"><input type="checkbox" id="studyHide" ${hide ? "checked" : ""}> Hide answers</label></div><p class="stcount" id="stcount"></p>`;
  qs.forEach(q => {
    const sa = studyAnswer(q, hide), body = `${sa.ans}<div class="explain"><b>Why</b>${q.e}</div>`;
    const text = (q.q + " " + (q.code || "") + " " + q.e).replace(/<[^>]+>/g, " ").toLowerCase();
    html += `<div class="card st" data-st="1" data-stset="${setOf[q.id] || ""}" data-sttopic="t:${q.topic}" data-stfmt="f:${q.type}" data-text="${text.replace(/"/g, "&quot;")}">
      <div class="stnum"><span><b>Question ${pos[q.id]}</b></span><span>${TOPICS[q.topic].title} · ${FORMATS[q.type].name}</span></div>
      ${caseBox(q)}<p class="qtext">${q.q}</p>${codeBox(q)}${sa.opts}
      ${hide ? `<details class="reveal"><summary>Show answer</summary>${body}</details>` : body}</div>`;
  });
  mount(html, true);
  applyStudyFilter();
}
function applyStudyFilter() {
  const f = (document.getElementById("studyFilter") || {}).value || "all", term = ((document.getElementById("studySearch") || {}).value || "").trim().toLowerCase();
  let n = 0;
  document.querySelectorAll("[data-st]").forEach(el => {
    const okF = f === "all" || el.dataset.stset === f || el.dataset.sttopic === f || el.dataset.stfmt === f;
    const okT = !term || term.split(/\s+/).every(w => el.dataset.text.includes(w));
    el.style.display = okF && okT ? "" : "none"; if (okF && okT) n++;
  });
  const c = document.getElementById("stcount"); if (c) c.textContent = n + " question" + (n === 1 ? "" : "s") + " shown";
}
function renderReview(onlyWrong) {
  const r = run;
  const items = r.qs.map((q, i) => ({ q, i })).filter(x => !onlyWrong || !r.results[x.i]);
  let html = `<button class="back" data-act="exam-result">← Back to my score</button><h2>Review your answers</h2>
    <div class="actions"><button class="btn ghost" data-act="${onlyWrong ? "review-exam" : "review-wrong"}">${onlyWrong ? "Show all questions" : "Show only the ones I missed"}</button></div>`;
  if (!items.length) html += `<div class="card"><p>You got every question right. Nothing to review!</p></div>`;
  items.forEach(({ q, i }) => {
    const ok = r.results[i];
    html += `<div class="card rv"><p class="rvhead ${ok ? "ok" : "no"}">${ok ? "✓ Correct" : !isAnswered(i) ? "✗ Not answered" : r.pts[i].p ? "◐ Partly right (" + r.pts[i].p + " of " + r.pts[i].m + ")" : "✗ Not quite"} · Question ${i + 1} · ${pillLabel(q)}</p>${caseBox(q)}<p class="qtext">${q.q}</p>${codeBox(q)}<div class="ans" style="border:0;padding:0;margin:0"><b>Correct answer</b>${answerText(q)}</div><div class="explain"><b>Why</b>${q.e}</div></div>`;
  });
  mount(html, true);
}

/* ---------- interactions ---------- */
function choose(k) {
  const r = run, i = r.i, q = r.qs[i];
  if (r.screen !== "q" || r.checked[i]) return;
  if (q.type === "single") { r.ans[i] = k; r.touched[i] = true; if (r.mode === "practice") return check(); }
  else { const a = r.ans[i], ix = a.indexOf(k); if (ix >= 0) a.splice(ix, 1); else a.push(k); r.touched[i] = true; }
  renderQuestion();
}
function check() {
  const r = run, i = r.i, q = r.qs[i];
  r.checked[i] = true; r.pts[i] = points(i); r.results[i] = r.pts[i].p === r.pts[i].m;
  recordResult(q, r.results[i]); save();
  r.focusId = "next"; renderQuestion();
}
function moveItem(from, to, focusId) {
  const r = run, a = r.ans[r.i];
  if (from === to || to < 0 || to >= a.length) return;
  const x = a.splice(from, 1)[0]; a.splice(to, 0, x);
  r.touched[r.i] = true; r.focusId = focusId || null; renderQuestion();
}
function assign(k, j) {
  const r = run, a = r.ans[r.i], from = a.indexOf(j), prev = a[k];
  if (from >= 0) a[from] = (from !== k && prev !== null) ? prev : null;
  a[k] = j; r.sel = null; renderQuestion();
}
function unassign(j) { const r = run, a = r.ans[r.i]; a.forEach((x, idx) => { if (x === j) a[idx] = null; }); r.sel = null; renderQuestion(); }
function goTo(k) { run.i = k; run.sel = null; run.confirming = false; if (run.mode === "exam") run.screen = "q"; renderQuestion(true); }

app.addEventListener("click", e => {
  const t = e.target.closest("[data-topic],[data-fmt],[data-act],[data-k],[data-slot],[data-chip],[data-nav],[data-bank]");
  if (!t) return;
  const d = t.dataset;
  if (d.bank) { store.bank = d.bank; save(); return home(); }
  if (d.topic) { const tp = TOPICS[d.topic]; return startPractice(tp.title, shuffle(topicQs(tp).map(q => q.id)), "topic", tp.id); }
  if (d.fmt) return startPractice(FORMATS[d.fmt].name, shuffle(bankQs().filter(q => q.type === d.fmt).map(q => q.id)).slice(0, 15), "format");
  if (d.k !== undefined) return choose(+d.k);
  if (d.nav !== undefined) return goTo(+d.nav);
  if (d.chip !== undefined) { run.sel = run.sel === +d.chip ? null : +d.chip; run.focusId = "c" + d.chip; return renderQuestion(); }
  if (d.slot !== undefined) {
    const r = run, k = +d.slot, a = r.ans[r.i];
    if (r.sel !== null) return assign(k, r.sel);
    if (a[k] !== null) { a[k] = null; return renderQuestion(); }
    return;
  }
  const act = d.act;
  if (act === "up") { const p = +d.pos; return moveItem(p, p - 1, p - 1 === 0 ? "d0" : "u" + (p - 1)); }
  if (act === "down") { const p = +d.pos, last = run.ans[run.i].length - 1; return moveItem(p, p + 1, p + 1 === last ? "u" + last : "d" + (p + 1)); }
  if (act === "home") home();
  else if (act === "check") check();
  else if (act === "flag") { run.flags[run.i] = !run.flags[run.i]; run.focusId = "flag"; renderQuestion(); }
  else if (act === "topics") { const el = document.getElementById("topics"); if (el) el.scrollIntoView({ behavior: "smooth" }); }
  else if (act === "next") { if (run.mode === "exam") { if (run.i === run.qs.length - 1) { run.screen = "rev"; renderRevScreen(); } else goTo(run.i + 1); } else if (run.i === run.qs.length - 1) finishPractice(); else { run.i++; renderQuestion(true); } }
  else if (act === "prev") goTo(run.i - 1);
  else if (act === "finish") { run.confirming = true; run.focusId = "cf"; run.mode === "exam" ? (run.screen = "rev", renderRevScreen()) : renderQuestion(); }
  else if (act === "cancelfinish") { run.confirming = false; run.mode === "exam" && run.screen === "rev" ? renderRevScreen() : renderQuestion(); }
  else if (act === "confirmfinish") finishExam();
  else if (act === "beginexam") beginExam();
  else if (act === "revscreen") { run.screen = "rev"; run.confirming = false; renderRevScreen(); }
  else if (act === "revfilter") { run.revFilter = d.f; renderRevScreen(); }
  else if (act === "backtoq") { run.screen = "q"; run.confirming = false; renderQuestion(true); }
  else if (act === "toggletime") { run.hideTime = !run.hideTime; run.screen === "rev" ? renderRevScreen() : renderQuestion(); }
  else if (act === "exam") startExam();
  else if (act === "study") renderStudy();
  else if (act === "examset") startExam(+d.set);
  else if (act === "exam-result") renderExamResult();
  else if (act === "review-exam") renderReview(false);
  else if (act === "review-wrong") renderReview(true);
  else if (act === "mixed") startPractice("Mixed quiz", shuffle(bankQs().map(q => q.id)).slice(0, 20), "mixed");
  else if (act === "review") startPractice("Missed questions", shuffle(store.missed.filter(id => QBYID[id])), "review");
  else if (act === "retrywrong") startPractice("Retry: missed questions", shuffle(run.wrongIds), "review");
  else if (act === "again") { const r = run; startPractice(r.title, shuffle(r.qs.map(q => q.id)), r.kind, r.topicId); }
});

app.addEventListener("change", e => {
  if (e.target.id === "studyFilter") { store.studyFilter = e.target.value; save(); return applyStudyFilter(); }
  if (e.target.id === "studyHide") { store.studyHide = e.target.checked; save(); const f = store.studyFilter, y = window.scrollY; renderStudy(); return; }
  if (e.target.id === "examLen") { store.examLen = +e.target.value; save(); return home(); }
  const yn = e.target.closest("[data-yn]");
  if (yn && run && run.screen === "q") { const k = +yn.dataset.yn; run.ans[run.i][k] = yn.value; run.touched[run.i] = true; run.focusId = yn.dataset.fid; return renderQuestion(); }
  const el = e.target.closest("[data-sel]");
  if (!el || !run || run.screen !== "q") return;
  const q = run.qs[run.i], k = +el.dataset.sel;
  run.ans[run.i][k] = el.value === "" ? null : q.slots[k].c[+el.value];
  run.touched[run.i] = true; run.focusId = "sel" + k; renderQuestion();
});

app.addEventListener("input", e => { if (e.target.id === "studySearch") applyStudyFilter(); });

/* drag and drop (mouse); tap and arrow buttons cover touch and keyboard */
app.addEventListener("dragstart", e => {
  if (!run || run.screen !== "q") return;
  const t = e.target.closest ? e.target.closest("[data-pos],[data-chip],[data-slot]") : null;
  if (!t || !t.draggable) return;
  if (t.tagName === "LI") run.drag = { t: "o", pos: +t.dataset.pos };
  else if (t.dataset.chip !== undefined) run.drag = { t: "c", chip: +t.dataset.chip };
  else if (t.dataset.slot !== undefined) { const c = run.ans[run.i][+t.dataset.slot]; if (c === null) return; run.drag = { t: "c", chip: c }; }
  e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", "x");
});
app.addEventListener("dragover", e => {
  if (!run || !run.drag) return;
  if (run.drag.t === "o" && e.target.closest("li[data-pos]")) e.preventDefault();
  if (run.drag.t === "c" && (e.target.closest("[data-slot]") || e.target.closest("[data-pool]"))) e.preventDefault();
});
app.addEventListener("drop", e => {
  if (!run || !run.drag) return;
  const d = run.drag; run.drag = null;
  if (d.t === "o") { const li = e.target.closest("li[data-pos]"); if (li) { e.preventDefault(); moveItem(d.pos, +li.dataset.pos); } }
  else { const s = e.target.closest("[data-slot]"), p = e.target.closest("[data-pool]"); if (s) { e.preventDefault(); assign(+s.dataset.slot, d.chip); } else if (p) { e.preventDefault(); unassign(d.chip); } }
});
app.addEventListener("dragend", () => { if (run) run.drag = null; });

document.getElementById("brand").addEventListener("click", () => home());
home();
};
</script>
</body>
</html>
