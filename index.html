<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-200 Practice</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #ffffff; --ink: #201f1e; --muted: #605e5c; --line: #e1dfdd; --subtle: #f3f2f1;
  --primary: #0078d4; --primary-dark: #005a9e; --primary-ink: #ffffff; --primary-soft: #eff6fc;
  --good: #107c10; --good-soft: #dff6dd; --bad: #a4262c; --bad-soft: #fde7e9; --flag: #ffb900;
  --focus: #000000; --acc: #0078d4;
  --shadow: 0 1.6px 3.6px rgba(0,0,0,.13), 0 0.3px 0.9px rgba(0,0,0,.1);
}
html { color-scheme: light; scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: var(--ink); font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px; line-height: 1.5; }
main { max-width: 960px; margin: 0 auto; padding: 28px 20px 72px; }
main.wide { max-width: 1120px; }
h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); line-height: 1.2; margin: 0 0 10px; font-weight: 600; }
h2 { font-size: 1.25rem; margin: 0; font-weight: 600; }
p { margin: 0; }
.lead { color: var(--muted); max-width: 60ch; font-size: 1.05rem; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code { font-family: Consolas, "Cascadia Mono", ui-monospace, Menlo, monospace; font-size: .9em; background: var(--subtle); padding: 1px 5px; border-radius: 3px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: #fff; border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.05rem; }
.badge { background: var(--primary); color: #fff; font-weight: 700; padding: 2px 8px; border-radius: 2px; font-size: .95rem; }
.disc { color: var(--muted); font-size: .82rem; text-align: right; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 4px; }
.btn { border: 1px solid var(--primary); background: var(--primary); color: var(--primary-ink); padding: 9px 20px; border-radius: 2px; font-weight: 600; min-height: 40px; }
.btn:hover:not([disabled]) { background: var(--primary-dark); border-color: var(--primary-dark); }
.btn.ghost { background: #fff; color: var(--ink); border-color: #8a8886; }
.btn.ghost:hover:not([disabled]) { background: var(--subtle); border-color: #605e5c; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.hero2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; align-items: stretch; padding: 8px 0 8px; }
.hl { padding: 8px 0; }
.facts { display: flex; flex-wrap: wrap; margin: 18px 0 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 2px; width: fit-content; max-width: 100%; }
.facts li { padding: 8px 16px; border-right: 1px solid var(--line); font-size: .92rem; color: var(--muted); }
.facts li:last-child { border-right: 0; }
.facts b { color: var(--ink); font-size: 1.15rem; margin-right: 4px; }
.ready { background: var(--subtle); border-radius: 4px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.ringrow { display: flex; align-items: center; gap: 16px; }
.ring { --p: 0; flex: none; width: 92px; height: 92px; border-radius: 50%; background: conic-gradient(var(--primary) calc(var(--p) * 1%), #d2d0ce 0); display: grid; place-items: center; position: relative; }
.ring::after { content: ""; position: absolute; inset: 10px; background: var(--subtle); border-radius: 50%; }
.ring span { position: relative; z-index: 1; font-weight: 700; font-size: 1.3rem; }
.ready h2 { font-size: 1.05rem; }
.ready .small { font-size: .88rem; color: var(--muted); }
.drow { display: flex; justify-content: space-between; font-size: .88rem; font-weight: 600; margin-bottom: 4px; }
.mini { height: 6px; background: #d2d0ce; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
.mini > i { display: block; height: 100%; background: var(--acc); }

.domain { margin-top: 38px; }
.domain-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 2px; }
.weight { color: var(--muted); font-size: .9rem; }
.domain-note { color: var(--muted); font-size: .95rem; margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.topic { text-align: left; background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--acc); border-radius: 4px; padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
.topic:hover { box-shadow: 0 6.4px 14.4px rgba(0,0,0,.18), 0 1.2px 3.6px rgba(0,0,0,.12); }
.topic strong { font-size: 1.02rem; font-weight: 600; }
.topic .blurb { color: var(--muted); font-size: .9rem; line-height: 1.4; flex: 1; }
.topic .meta { font-size: .85rem; color: var(--muted); }
.fmt { border-top-color: var(--primary); }
.ico { width: 34px; height: 34px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); border-radius: 4px; font-size: 1.2rem; font-weight: 700; margin-bottom: 2px; }
.bar { height: 6px; background: var(--subtle); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--acc); }

.back { background: none; border: 0; color: var(--primary); font-weight: 600; padding: 6px 0; margin-bottom: 8px; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: .95rem; flex-wrap: wrap; }
.qtitle { font-weight: 600; color: var(--ink); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.05rem; }
.timer.low { color: #ffb4b8; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 22px 22px; margin-top: 14px; box-shadow: var(--shadow); }
.cardtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.pill { display: inline-block; font-size: .82rem; font-weight: 600; color: var(--primary-dark); background: var(--primary-soft); border: 1px solid #c7e0f4; padding: 1px 10px; border-radius: 2px; margin-bottom: 10px; }
.cardtop .pill { margin-bottom: 0; }
.qtext { font-size: 1.15rem; font-weight: 600; line-height: 1.45; margin-bottom: 16px; }
.hint { color: var(--muted); font-size: .92rem; margin-bottom: 10px; }
.flagbtn { background: #fff; border: 1px solid #8a8886; border-radius: 2px; padding: 4px 12px; font-size: .88rem; font-weight: 600; }
.flagbtn.on { background: #fff4ce; border-color: var(--flag); }

.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; }
.opt:hover:not([disabled]) { background: var(--subtle); border-color: #c8c6c4; }
.rad, .chk { flex: none; width: 20px; height: 20px; margin-top: 1px; border: 2px solid #605e5c; background: #fff; display: grid; place-items: center; font-size: .8rem; font-weight: 800; color: #fff; }
.rad { border-radius: 50%; }
.chk { border-radius: 3px; }
.rad.on { border-color: var(--primary); box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 20px var(--primary); }
.chk.on { background: var(--primary); border-color: var(--primary); }
.ltr { flex: none; font-weight: 600; color: var(--muted); width: 18px; }
.otx { flex: 1; min-width: 0; }
.tag { margin-left: auto; font-weight: 700; font-size: .85rem; white-space: nowrap; padding-left: 8px; }
.opt.sel { border-color: var(--primary); background: var(--primary-soft); }
.opt.correct, .oi.correct, .slot.correct { border-color: var(--good); background: var(--good-soft); }
.opt.wrong, .oi.wrong, .slot.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.missed { border: 1px dashed var(--good); }
.opt.correct .tag, .oi.correct .tag, .slot.correct .tag, .opt.missed .tag { color: var(--good); }
.opt.wrong .tag, .oi.wrong .tag, .slot.wrong .tag { color: var(--bad); }
.opt[disabled] { cursor: default; }

.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.oi { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; }
.oi[draggable="true"] { cursor: grab; }
.grip { color: #a19f9d; letter-spacing: -2px; font-weight: 800; }
.num { flex: none; width: 24px; height: 24px; background: var(--primary); color: #fff; border-radius: 2px; display: grid; place-items: center; font-weight: 700; font-size: .82rem; }
.txt { flex: 1; min-width: 0; }
.mv { display: flex; gap: 6px; }
.sq { width: 34px; height: 34px; border-radius: 2px; border: 1px solid #8a8886; background: #fff; font-weight: 700; }
.sq:hover:not([disabled]) { background: var(--subtle); }
.sq[disabled] { opacity: .35; cursor: default; }

.mrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 8px; }
.mleft { font-weight: 600; background: var(--subtle); padding: 10px 12px; border-radius: 2px; }
.slot { width: 100%; min-height: 44px; text-align: left; border: 1px dashed #8a8886; border-radius: 2px; background: #fff; padding: 8px 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.slot.filled { border-style: solid; border-color: var(--primary); background: var(--primary-soft); color: var(--ink); font-weight: 600; }
.slot.correct, .slot.wrong { border-style: solid; color: var(--ink); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border: 1px dashed #c8c6c4; background: var(--subtle); border-radius: 2px; margin-top: 8px; min-height: 56px; }
.chip { background: #fff; border: 1px solid var(--primary); color: var(--primary-dark); border-radius: 2px; padding: 6px 12px; font-weight: 600; cursor: grab; text-align: left; box-shadow: var(--shadow); }
.chip.picked { background: var(--primary); color: #fff; }

.explain { margin-top: 16px; padding: 14px 16px; border-radius: 2px; background: var(--primary-soft); border-left: 4px solid var(--primary); }
.explain > b { display: block; margin-bottom: 2px; }
.explain.good { background: var(--good-soft); border-left-color: var(--good); }
.explain.bad { background: var(--bad-soft); border-left-color: var(--bad); }
.explain.good > b { color: var(--good); }
.explain.bad > b { color: var(--bad); }
.ans { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,.12); }
.ans ul, .ans ol { margin: 4px 0 0; padding-left: 22px; }
.next { margin-top: 18px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

.xbar { background: #004578; color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 16px; border-radius: 4px; }
.xt { font-weight: 600; display: flex; flex-direction: column; line-height: 1.25; }
.xt small { font-weight: 400; opacity: .8; }
.xq { font-weight: 600; }
.xtime { font-size: .9rem; display: flex; align-items: center; gap: 8px; }
.xtime .timer { background: rgba(255,255,255,.15); padding: 2px 10px; border-radius: 2px; color: #fff; }
.xlayout { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 20px; align-items: start; }
.xside { margin-top: 14px; border: 1px solid var(--line); border-radius: 4px; padding: 14px; background: var(--subtle); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); }
.xside h2 { font-size: 1rem; }
.examnav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.examnav > div { display: flex; gap: 10px; }
.navg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.navb { width: 36px; height: 36px; border-radius: 2px; border: 1px solid #c8c6c4; background: #fff; font-weight: 600; position: relative; }
.navb.ans { background: var(--primary); border-color: var(--primary); color: #fff; }
.navb.flag::after { content: ""; position: absolute; top: 0; right: 0; border-top: 11px solid var(--flag); border-left: 11px solid transparent; }
.navb.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { list-style: none; margin: 12px 0 0; padding: 0; font-size: .85rem; color: var(--muted); display: grid; gap: 4px; }
.sw { display: inline-block; width: 12px; height: 12px; border: 1px solid #c8c6c4; background: #fff; margin-right: 8px; vertical-align: -1px; }
.sw.ans { background: var(--primary); border-color: var(--primary); }
.sw.flag { background: var(--flag); border-color: var(--flag); }
.confirm { margin-top: 14px; padding: 16px; border-radius: 2px; border-left: 4px solid var(--primary); background: var(--primary-soft); }

.result { text-align: center; padding: 30px 20px; }
.score { font-size: 3.4rem; font-weight: 600; line-height: 1.1; margin: 10px 0; color: var(--primary); }
.verdict { display: inline-block; font-weight: 700; padding: 4px 16px; border-radius: 2px; margin-bottom: 8px; }
.verdict.pass { background: var(--good-soft); color: var(--good); }
.verdict.fail { background: var(--bad-soft); color: var(--bad); }
.result .actions { justify-content: center; }
.brk { text-align: left; max-width: 540px; margin: 22px auto 0; }
.brow { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; font-size: .92rem; margin-top: 10px; }
.rv { margin-top: 14px; }
.rvhead { font-weight: 700; margin-bottom: 6px; }
.rvhead.ok { color: var(--good); }
.rvhead.no { color: var(--bad); }


.dd { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.5fr); gap: 18px; align-items: start; }
.dd.one { grid-template-columns: 1fr; }
.ddcol h3 { font-size: .95rem; font-weight: 600; margin: 0 0 8px; color: var(--muted); }
.pool { flex-direction: column; flex-wrap: nowrap; margin-top: 0; }
.pool:empty::before { content: "All placed"; color: var(--muted); font-size: .9rem; }
.pool .chip { width: 100%; }
.mrow { margin-bottom: 8px; }
@media (max-width: 700px) { .dd { grid-template-columns: 1fr; } }
@media (max-width: 860px) { .hero2 { grid-template-columns: 1fr; } .xlayout { grid-template-columns: 1fr; } .xside { position: static; } }
@media (max-width: 560px) { .mrow { grid-template-columns: 1fr; gap: 6px; } .disc { display: none; } .facts li { padding: 8px 12px; } }
</style>
</head>
<body>
<header class="top"><div class="top-in"><button class="brand" id="brand" aria-label="Go to the start page"><span class="badge">AI-200</span><span>Practice tests</span></button><span class="disc">Unofficial practice site. Not affiliated with Microsoft.</span></div></header>
<main id="app"></main>

<script>
/* All questions are original practice items written against the public AI-200 skills outline. */
const M = (q, o, c, e) => ({ type: "multi", q, o, c, e });
const O = (q, items, e) => ({ type: "order", q, items, e });
const P = (q, pairs, extra, e) => ({ type: "match", q, pairs, extra: extra || [], e });

const FORMATS = {
  single: { name: "Multiple choice", blurb: "Pick the one best answer." },
  multi: { name: "Choose more than one", blurb: "Select every answer that applies." },
  order: { name: "Drag to order", blurb: "Put the steps in the right order." },
  match: { name: "Drag to match", blurb: "Match each item with its partner." }
};

const DOMAINS = [
{ name: "Containers", weight: "About 20–25% of the exam", note: "Building, storing and running container images on Azure.", topics: [
  { id: "acr", title: "Container images and Azure Container Registry", blurb: "Building, pulling and distributing images.", qs: [
    { q: "Your team has no Docker installed on their laptops, but they need to build an image and push it to Azure Container Registry. What should they use?",
      o: ["<code>az acr build</code> (an ACR Tasks quick build)", "<code>az container create</code>", "<code>az acr import</code>", "Enable the admin user and run <code>docker push</code>"],
      e: "ACR Tasks builds the image inside Azure from your source, so no local Docker daemon is needed. <code>az acr import</code> only copies an image that already exists." },
    { q: "An AKS cluster must pull images from a private registry without anyone storing passwords. What is the best approach?",
      o: ["Give the cluster's kubelet managed identity the <b>AcrPull</b> role on the registry", "Turn on the registry admin user and paste the password into a manifest", "Store a service principal secret in a ConfigMap", "Allow anonymous pull on the registry"],
      e: "A managed identity with AcrPull needs no stored secret and follows least privilege." },
    { q: "Your image is 1.4 GB because it ships compilers and build tools. Which technique shrinks it most directly?",
      o: ["A multi-stage build that copies only the build output into a slim final image", "Add more <code>RUN</code> layers", "Tag the image <code>latest</code>", "Zip the source before copying it in"],
      e: "Multi-stage builds leave the build tools behind in an earlier stage, so the final image only holds what the app needs at runtime." },
    { q: "Users in Europe and Asia pull images slowly from a registry in the US. Which feature helps?",
      o: ["Geo-replication (Premium tier)", "A larger storage quota", "Tag locking", "An ACR Task that runs hourly"],
      e: "Geo-replication keeps copies of the registry near each region, so pulls are faster and more resilient." },
    M("Which <b>two</b> actions help keep a registry tidy and reduce storage cost?",
      ["Set a retention policy for untagged manifests (Premium tier)", "Run a scheduled ACR task that uses <code>acr purge</code> to remove old tags", "Turn on the admin user", "Add more geo-replicas"], [0, 1],
      "Retention policies clean up untagged manifests, and <code>acr purge</code> in a scheduled task removes old tags. The admin user does nothing for storage, and extra replicas add more copies."),
    O("Put the parts of a multi-stage Dockerfile in order.",
      ["<code>FROM</code> the SDK image <code>AS build</code>", "<code>RUN</code> the publish command in that stage", "<code>FROM</code> the slim runtime image", "<code>COPY --from=build</code> the published output"],
      "The build stage has to exist and produce output before the runtime stage can copy from it.")
  ] },
  { id: "aca", title: "Azure Container Apps", blurb: "Scaling, revisions, jobs and secrets.", qs: [
    { q: "A web API on Azure Container Apps should add replicas when the number of concurrent requests rises. Which scale rule fits?",
      o: ["An HTTP scale rule based on concurrent requests", "A cron scale rule", "A rule based on node disk size", "A storage queue length rule"],
      e: "HTTP scale rules watch concurrent requests, which is exactly the signal an API needs." },
    { q: "You want to send 10% of traffic to a new version and 90% to the current one. What do you set up?",
      o: ["Multiple revision mode with traffic weights", "Single revision mode and two separate apps", "Session affinity", "A higher minimum replica count"],
      e: "In multiple revision mode, several revisions stay active and you split traffic between them by percentage." },
    { q: "A nightly report generator runs for 20 minutes and then exits. Which Container Apps resource fits best?",
      o: ["A Container Apps job with a schedule trigger", "An app with external ingress and 10 minimum replicas", "An app with a Dapr sidecar", "An app with session affinity"],
      e: "Jobs run to completion and stop, so you only pay while they run. A schedule trigger starts them on a cron expression." },
    { q: "Your container needs a database password as an environment variable, without hardcoding it in the image. What should you do?",
      o: ["Define a secret on the container app and reference it from the environment variable", "Add it with <code>ENV</code> in the Dockerfile", "Include it in the image tag", "Commit it in <code>appsettings.json</code>"],
      e: "App secrets (or Key Vault references) keep sensitive values out of the image and the repository." },
    M("Which <b>two</b> things let you roll back quickly after a bad release?",
      ["Keep the previous revision active (multiple revision mode)", "Shift traffic weight back to the previous revision", "Delete the Container Apps environment", "Turn off ingress"], [0, 1],
      "With the old revision still running, you only need to move the traffic weights back. Deleting the environment or turning off ingress just causes an outage."),
    O("Roll out a new version to 10% of users. Put the steps in order.",
      ["Switch the app to multiple revision mode", "Deploy the new revision", "Send 10% of traffic to the new revision", "After checks pass, move 100% of traffic to it"],
      "Multiple revision mode comes first so the old revision stays alive. You only widen traffic after the small test looks healthy.")
  ] },
  { id: "aks", title: "AKS and troubleshooting pods", blurb: "Common pod errors and Kubernetes helpers.", qs: [
    { q: "A pod shows <code>ImagePullBackOff</code>. What should you check first?",
      o: ["The image name and tag, and whether the cluster can authenticate to the registry (<code>kubectl describe pod</code>)", "The Horizontal Pod Autoscaler", "The ingress certificate", "Node CPU quotas"],
      e: "ImagePullBackOff means Kubernetes can't pull the image. A wrong name, a missing tag or missing registry permission are the usual causes." },
    { q: "A container was terminated with exit code 137 and reason <code>OOMKilled</code>. What happened?",
      o: ["It used more memory than its limit", "It failed its liveness probe", "The image couldn't be pulled", "The node was cordoned"],
      e: "OOMKilled means the container went over its memory limit. Raise the limit or fix the memory use." },
    { q: "Pods need secrets from Azure Key Vault mounted as files. Which AKS capability do you use?",
      o: ["Azure Key Vault provider for the Secrets Store CSI Driver", "CoreDNS", "kube-proxy", "A ResourceQuota"],
      e: "The Secrets Store CSI Driver, with the Key Vault provider, mounts secrets into pods without copying them into your manifests." },
    { q: "You want pods to scale out automatically when average CPU rises. Which Kubernetes object do you create?",
      o: ["HorizontalPodAutoscaler", "PodDisruptionBudget", "NetworkPolicy", "ResourceQuota"],
      e: "The HorizontalPodAutoscaler adds or removes pod replicas based on metrics such as CPU." },
    M("Your app must handle traffic spikes. Which <b>two</b> AKS features add capacity automatically?",
      ["Horizontal Pod Autoscaler (more pods)", "Cluster autoscaler (more nodes)", "PodDisruptionBudget", "NetworkPolicy"], [0, 1],
      "The Horizontal Pod Autoscaler adds pods, and the cluster autoscaler adds nodes when pods have nowhere to run."),
    O("Troubleshoot a pod that won't start. Put the steps in order, from broad to specific.",
      ["Run <code>kubectl get pods</code> to see the status", "Run <code>kubectl describe pod</code> to read the events", "Run <code>kubectl logs</code> to read the container output", "Fix the cause and redeploy"],
      "Start with the overall status, then the events, then the container's own output, and only then change something."),
    P("Match each pod status or reason with what it usually means.",
      [["<code>ImagePullBackOff</code>", "The image can't be pulled (wrong name or registry access)"], ["<code>OOMKilled</code>", "The container went over its memory limit"], ["<code>CrashLoopBackOff</code>", "The container starts, exits, and is restarted over and over"]], [],
      "Each status points to a different place to look: the image and registry, the memory limit, or the application's own logs.")
  ] }
] },

/* ---------- setup ---------- */
const TOPICS = {}, ALL = [];
DOMAINS.forEach(d => d.topics.forEach(t => {
  TOPICS[t.id] = t;
  t.qs.forEach((q, i) => { q.type = q.type || "single"; q.id = t.id + "-" + (i + 1); q.topic = t.id; ALL.push(q); });
}));
const QBYID = Object.fromEntries(ALL.map(q => [q.id, q]));
const EXAM_SIZE = Math.min(40, ALL.length), EXAM_MINUTES = 60, PASS = 70;

let store = { best: {}, missed: [], bestExam: null };
try { const raw = localStorage.getItem("ai200-practice-v2"); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem("ai200-practice-v2", JSON.stringify(store)); } catch (e) {} }

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const app = document.getElementById("app");
let run = null, timerId = null;
function clearTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

/* ---------- run engine ---------- */
function makeView(q) {
  if (q.type === "single" || q.type === "multi") return { perm: shuffle(q.o.map((_, i) => i)) };
  if (q.type === "order") return { chips: shuffle(q.items.map((_, i) => i)) };
  return { chips: shuffle(q.pairs.map(p => p[1]).concat(q.extra || [])) };
}
function initAns(q, v) {
  if (q.type === "single") return null;
  if (q.type === "multi") return [];
  if (q.type === "order") return q.items.map(() => null);
  return q.pairs.map(() => null);
}
function newRun(o) {
  const r = Object.assign({ i: 0, ans: [], view: [], checked: [], touched: [], flags: [], results: [], sel: null, drag: null, screen: "q", confirming: false, focusId: null }, o);
  r.qs = o.ids.map(id => QBYID[id]);
  r.qs.forEach((q, i) => { r.view[i] = makeView(q); r.ans[i] = initAns(q, r.view[i]); r.checked[i] = false; r.touched[i] = false; });
  return r;
}
function isAnswered(i) {
  const q = run.qs[i], a = run.ans[i];
  if (q.type === "single") return a !== null;
  if (q.type === "multi") return a.length > 0;
  if (q.type === "order") return a.some(x => x !== null);
  return a.some(x => x !== null);
}
function grade(i) {
  const q = run.qs[i], a = run.ans[i], v = run.view[i];
  if (q.type === "single") return a !== null && v.perm[a] === 0;
  if (q.type === "multi") { const s = a.map(k => v.perm[k]).sort().join(","); return s === q.c.slice().sort().join(","); }
  if (q.type === "order") return q.items.every((_, p) => a[p] !== null && v.chips[a[p]] === p);
  return q.pairs.every((p, k) => a[k] !== null && v.chips[a[k]] === p[1]);
}
function answerText(q) {
  if (q.type === "single") return "<p>" + q.o[0] + "</p>";
  if (q.type === "multi") return "<ul>" + q.c.map(k => "<li>" + q.o[k] + "</li>").join("") + "</ul>";
  if (q.type === "order") return "<ol>" + q.items.map(t => "<li>" + t + "</li>").join("") + "</ol>";
  return "<ul>" + q.pairs.map(p => "<li>" + p[0] + " → " + p[1] + "</li>").join("") + "</ul>";
}
function recordMissed(q, ok) {
  if (ok) store.missed = store.missed.filter(id => id !== q.id);
  else if (!store.missed.includes(q.id)) store.missed.push(q.id);
}

/* ---------- rendering ---------- */
function mount(html, scroll) {
  const act = document.activeElement;
  const fid = (run && run.focusId) || (act && act.dataset && act.dataset.fid);
  app.classList.toggle("wide", !!(run && run.mode === "exam" && run.screen === "q"));
  app.innerHTML = html;
  if (fid) { const el = app.querySelector('[data-fid="' + fid + '"]'); if (el && !el.disabled) el.focus({ preventScroll: true }); }
  if (run) run.focusId = null;
  if (scroll) window.scrollTo(0, 0);
}

const ACC = ["#0078d4", "#5c2d91", "#008272", "#c43e00"];
const FICON = { single: "◉", multi: "☑", order: "⇅", match: "⇄" };
function domainPct(d) { let b = 0, n = 0; d.topics.forEach(t => { n += t.qs.length; b += store.best[t.id] || 0; }); return n ? Math.round(b / n * 100) : 0; }

function home() {
  clearTimer(); run = null;
  const missed = store.missed.filter(id => QBYID[id]);
  const tot = DOMAINS.reduce((a, d) => { d.topics.forEach(t => { a.n += t.qs.length; a.b += store.best[t.id] || 0; }); return a; }, { n: 0, b: 0 });
  const overall = Math.round(tot.b / tot.n * 100);
  let html = `
    <section class="hero2">
      <div class="hl">
        <h1>AI-200: Developing AI Cloud Solutions on Azure</h1>
        <p class="lead">Practise for the Azure AI Cloud Developer Associate exam with original questions. Sit a timed practice exam, or work through one topic at a time.</p>
        <ul class="facts"><li><b>${EXAM_SIZE}</b>questions</li><li><b>${EXAM_MINUTES}</b>minutes</li><li><b>${PASS}%</b>to pass</li><li><b>4</b>question formats</li></ul>
        <div class="actions"><button class="btn" data-act="exam">Start the full practice exam</button><button class="btn ghost" data-act="topics">Browse topics</button></div>
      </div>
      <div class="ready">
        <div class="ringrow"><div class="ring" style="--p:${overall}"><span>${overall}%</span></div>
          <div><h2>Your progress</h2><p class="small">Based on your best score in each topic.${store.bestExam != null ? " Best full exam: " + store.bestExam + "%." : " Take the full exam for a realistic check."}</p></div></div>
        <div>${DOMAINS.map((d, i) => `<div class="drow"><span>${d.name}</span><span>${domainPct(d)}%</span></div><div class="mini" style="--acc:${ACC[i]}"><i style="width:${domainPct(d)}%"></i></div>`).join("")}</div>
      </div>
    </section>
    <section class="domain"><div class="domain-head"><h2>Practice by question format</h2></div>
      <p class="domain-note">Drill one format. You see feedback after every question.</p><div class="grid">`;
  Object.keys(FORMATS).forEach(f => {
    const n = ALL.filter(q => q.type === f).length;
    html += `<button class="topic fmt" data-fmt="${f}"><span class="ico" aria-hidden="true">${FICON[f]}</span><strong>${FORMATS[f].name}</strong><span class="blurb">${FORMATS[f].blurb}</span><span class="meta">${n} questions</span></button>`;
  });
  html += `</div><div class="actions"><button class="btn ghost" data-act="mixed">Mixed quiz (20 questions)</button><button class="btn ghost" data-act="review" ${missed.length ? "" : "disabled"}>Review missed (${missed.length})</button></div></section>`;
  html += `<section class="domain" id="topics"><div class="domain-head"><h2>Practice by topic</h2></div><p class="domain-note">Questions are grouped by what they have in common.</p></section>`;
  DOMAINS.forEach((d, di) => {
    html += `<section class="domain" style="margin-top:22px;--acc:${ACC[di]}"><div class="domain-head"><h2>${d.name}</h2><span class="weight">${d.weight}</span></div><p class="domain-note">${d.note}</p><div class="grid">`;
    d.topics.forEach(t => {
      const n = t.qs.length, b = store.best[t.id], pct = b == null ? 0 : Math.round(b / n * 100);
      html += `<button class="topic" data-topic="${t.id}"><strong>${t.title}</strong><span class="blurb">${t.blurb}</span><div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div><span class="meta">${b == null ? n + " questions" : "Best: " + b + " of " + n}</span></button>`;
    });
    html += `</div></section>`;
  });
  mount(html, true);
}

function qBody(i) {
  const r = run, q = r.qs[i], v = r.view[i], a = r.ans[i], done = r.mode === "practice" && r.checked[i];
  if (q.type === "single" || q.type === "multi") {
    const multi = q.type === "multi";
    return `<div class="opts" role="group" aria-labelledby="qtext">` + v.perm.map((orig, k) => {
      const s = multi ? a.includes(k) : k === a;
      let cls = "opt", tag = "";
      if (done) {
        const isC = multi ? q.c.includes(orig) : orig === 0;
        if (isC && (s || !multi)) { cls += " correct"; tag = "✓ Correct"; }
        else if (isC) { cls += " missed"; tag = "Should be selected"; }
        else if (s) { cls += " wrong"; tag = multi ? "✗ Not this one" : "✗ Not quite"; }
      } else if (s) { cls += " sel"; }
      const ind = multi ? `<span class="chk${s ? " on" : ""}" aria-hidden="true">${s ? "✓" : ""}</span>` : `<span class="rad${s ? " on" : ""}" aria-hidden="true"></span>`;
      return `<button class="${cls}" data-k="${k}" data-fid="o${k}" aria-pressed="${s}" ${done ? "disabled" : ""}>${ind}<span class="ltr">${"ABCDEF"[k]}.</span><span class="otx">${q.o[orig]}</span><span class="tag">${tag}</span></button>`;
    }).join("") + `</div>`;
  }
  /* order and match share one layout: answers on the left, answer area on the right */
  const isOrder = q.type === "order";
  const left = k => isOrder ? "Step " + (k + 1) : q.pairs[k][0];
  const text = j => isOrder ? q.items[v.chips[j]] : v.chips[j];
  const right = (k, c) => c !== null && (isOrder ? v.chips[c] === k : v.chips[c] === q.pairs[k][1]);
  const used = new Set(a.filter(x => x !== null));
  const rows = a.map((c, k) => {
    let cls = "slot" + (c !== null ? " filled" : ""), tag = "";
    if (done) { const ok = right(k, c); cls += ok ? " correct" : " wrong"; tag = ok ? "✓" : "✗"; }
    return `<div class="mrow"><div class="mleft">${left(k)}</div><button class="${cls}" data-slot="${k}" data-fid="s${k}" ${c !== null && !done ? 'draggable="true"' : ""} ${done ? "disabled" : ""}><span>${c !== null ? text(c) : "Drop here"}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</button></div>`;
  }).join("");
  const hint = done ? "Here is how your answers compare."
    : isOrder ? "Drag each step from the left into the answer area on the right, with the first step at the top. On a phone, tap a step, then tap a slot. Tap a filled slot to take it back."
    : "Drag each answer from the left onto its matching item on the right. On a phone, tap an answer, then tap a slot. Tap a filled slot to take it back.";
  const pool = done ? "" : `<div class="ddcol"><h3>${isOrder ? "Steps" : "Answers"}</h3><div class="pool" data-pool="1">` +
    v.chips.map((_, j) => used.has(j) ? "" : `<button class="chip${r.sel === j ? " picked" : ""}" data-chip="${j}" data-fid="c${j}" draggable="true">${text(j)}</button>`).join("") + `</div></div>`;
  return `<p class="hint">${hint}</p><div class="dd${done ? " one" : ""}">${pool}<div class="ddcol"><h3>Answer area</h3>${rows}</div></div>`;
}

function pillLabel(q) { return q.type === "multi" ? "Choose " + q.c.length : FORMATS[q.type].name; }

function renderQuestion(scroll) {
  const r = run, i = r.i, q = r.qs[i], n = r.qs.length;
  const done = r.mode === "practice" && r.checked[i];
  const exam = r.mode === "exam";
  let html = "";
  if (exam) {
    const flagged = !!r.flags[i];
    const answered = r.qs.filter((_, k) => isAnswered(k)).length;
    html += `<button class="back" data-act="home">← Leave exam</button>
      <div class="xbar"><div class="xt">AI-200: Developing AI Cloud Solutions on Azure<small>Practice exam</small></div><div class="xq">Question ${i + 1} of ${n}</div><div class="xtime">Time remaining <span class="timer" id="timer" role="timer">${fmtTime(r.endAt - Date.now())}</span></div></div>
      <div class="xlayout"><div class="xmain"><div class="card"><div class="cardtop"><span class="pill">${pillLabel(q)}</span><button class="flagbtn${flagged ? " on" : ""}" data-act="flag" data-fid="flag" aria-pressed="${flagged}">⚑ ${flagged ? "Marked for review" : "Mark for review"}</button></div><p class="qtext" id="qtext">${q.q}</p>${qBody(i)}</div>
      <div class="examnav"><div><button class="btn ghost" data-act="prev" ${i === 0 ? "disabled" : ""}>Previous</button><button class="btn" data-act="next" ${i === n - 1 ? "disabled" : ""}>Next</button></div><button class="btn ghost" data-act="finish">Finish exam</button></div>`;
    if (r.confirming) {
      const un = n - answered, fl = r.flags.filter(Boolean).length;
      html += `<div class="confirm" role="alertdialog" aria-label="Finish the exam?"><b>Finish the exam now?</b><p>${un ? "You have " + un + " unanswered question" + (un === 1 ? "" : "s") + ", which will count as incorrect." : "You have answered every question."}${fl ? " " + fl + " marked for review." : ""}</p><div class="actions"><button class="btn" data-act="confirmfinish" data-fid="cf">Yes, finish</button><button class="btn ghost" data-act="cancelfinish">Keep working</button></div></div>`;
    }
    html += `</div><aside class="xside" aria-label="Question navigator"><h2>Questions</h2><div class="navg" role="group">` +
      r.qs.map((_, k) => `<button class="navb${isAnswered(k) ? " ans" : ""}${r.flags[k] ? " flag" : ""}${k === i ? " cur" : ""}" data-nav="${k}" aria-label="Question ${k + 1}${isAnswered(k) ? ", answered" : ""}${r.flags[k] ? ", marked for review" : ""}">${k + 1}</button>`).join("") +
      `</div><ul class="legend"><li><i class="sw ans"></i>Answered</li><li><i class="sw"></i>Not answered</li><li><i class="sw flag"></i>Marked for review</li></ul><p class="muted" style="margin-top:10px;font-size:.88rem">${answered} of ${n} answered</p></aside></div>`;
  } else {
    html += `<button class="back" data-act="home">← All topics</button>
      <div class="qhead"><span class="qtitle">${r.title}</span><span>Question ${i + 1} of ${n}</span></div>
      <div class="bar" aria-hidden="true" style="margin-top:8px"><i style="width:${Math.round(i / n * 100)}%"></i></div>
      <div class="card"><span class="pill">${pillLabel(q)}</span><p class="qtext" id="qtext">${q.q}</p>${qBody(i)}`;
    if (done) {
      const ok = r.results[i], last = i === n - 1;
      html += `<div class="explain ${ok ? "good" : "bad"}" role="status"><b>${ok ? "Nice work!" : "Good to know:"}</b>${q.e}${!ok && (q.type === "order" || q.type === "match") ? `<div class="ans"><b>Correct answer</b>${answerText(q)}</div>` : ""}</div>
        <div class="next"><button class="btn" data-act="next" data-fid="next">${last ? "See my score" : "Next question"}</button></div>`;
    } else if (q.type !== "single") {
      const ready = q.type === "multi" ? r.ans[i].length > 0 : r.ans[i].every(x => x !== null);
      html += `<div class="next"><button class="btn" data-act="check" data-fid="check" ${ready ? "" : "disabled"}>Check my answer</button></div>`;
    }
    html += `</div>`;
  }
  mount(html, scroll);
}

function fmtTime(ms) { ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }

/* ---------- starting runs ---------- */
function startPractice(title, ids, kind, topicId) {
  clearTimer();
  run = newRun({ mode: "practice", title, kind, topicId, ids });
  renderQuestion(true);
}
function pickExam(n) {
  const pools = Object.values(TOPICS).map(t => shuffle(t.qs)), out = [];
  for (let k = 0; out.length < n; k++) {
    let added = false;
    for (const p of shuffle(pools)) { if (k < p.length && out.length < n) { out.push(p[k]); added = true; } }
    if (!added) break;
  }
  return shuffle(out).map(q => q.id);
}
function startExam() {
  clearTimer();
  run = newRun({ mode: "exam", title: "Full practice exam", kind: "exam", ids: pickExam(EXAM_SIZE), endAt: Date.now() + EXAM_MINUTES * 60000 });
  timerId = setInterval(() => {
    if (!run || run.mode !== "exam" || run.screen !== "q") return;
    const left = run.endAt - Date.now(), el = document.getElementById("timer");
    if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left < 300000); }
    if (left <= 0) finishExam();
  }, 1000);
  renderQuestion(true);
}

/* ---------- finishing ---------- */
function finishPractice() {
  const r = run, n = r.qs.length, score = r.results.filter(Boolean).length;
  if (r.kind === "topic" && (store.best[r.topicId] == null || store.best[r.topicId] < score)) { store.best[r.topicId] = score; save(); }
  const wrong = r.qs.filter((_, i) => !r.results[i]).map(q => q.id);
  const pct = Math.round(score / n * 100);
  const msg = pct === 100 ? "Perfect round. Great job!" : pct >= 70 ? "Solid work. A little more practice and you're there." : pct >= 40 ? "A good start. Read the explanations and try again." : "Everyone starts somewhere. Review the explanations and give it another go.";
  r.screen = "result"; r.wrongIds = wrong;
  mount(`<div class="card result"><p class="lead" style="margin:0 auto">${r.title}</p><div class="score">${score} / ${n}</div><p>${msg}</p>
    <div class="actions">${wrong.length ? `<button class="btn" data-act="retrywrong">Retry the ${wrong.length} I missed</button>` : ""}
    <button class="btn ${wrong.length ? "ghost" : ""}" data-act="again">Try again</button><button class="btn ghost" data-act="home">Back to the start</button></div></div>`, true);
}
function finishExam() {
  clearTimer();
  const r = run; if (r.screen !== "q") return;
  r.qs.forEach((q, i) => { r.results[i] = isAnswered(i) && grade(i); recordMissed(q, r.results[i]); });
  const n = r.qs.length, score = r.results.filter(Boolean).length, pct = Math.round(score / n * 100);
  if (store.bestExam == null || store.bestExam < pct) store.bestExam = pct;
  save();
  r.score = score; r.pct = pct; r.screen = "result";
  renderExamResult();
}
function renderExamResult() {
  const r = run, n = r.qs.length, pass = r.pct >= PASS;
  const by = {};
  r.qs.forEach((q, i) => { by[q.topic] = by[q.topic] || { t: 0, c: 0 }; by[q.topic].t++; if (r.results[i]) by[q.topic].c++; });
  const rows = Object.keys(by).map(id => { const b = by[id], p = Math.round(b.c / b.t * 100); return `<div class="brow"><span>${TOPICS[id].title}</span><span>${b.c} of ${b.t}</span></div><div class="bar" aria-hidden="true"><i style="width:${p}%"></i></div>`; }).join("");
  mount(`<div class="card result"><p class="lead" style="margin:0 auto">${r.title}</p><div class="score">${r.pct}%</div>
    <span class="verdict ${pass ? "pass" : "fail"}">${pass ? "You passed" : "Not yet"} · pass mark ${PASS}%</span>
    <p>${r.score} of ${n} correct. ${pass ? "Nice work." : "Review the ones you missed and try again."}</p>
    <div class="brk"><h2>How you did by topic</h2>${rows}</div>
    <div class="actions"><button class="btn" data-act="review-exam">Review my answers</button><button class="btn ghost" data-act="exam">Take another exam</button><button class="btn ghost" data-act="home">Back to the start</button></div></div>`, true);
}
function renderReview(onlyWrong) {
  const r = run;
  const items = r.qs.map((q, i) => ({ q, i })).filter(x => !onlyWrong || !r.results[x.i]);
  let html = `<button class="back" data-act="exam-result">← Back to my score</button><h2>Review your answers</h2>
    <div class="actions"><button class="btn ghost" data-act="${onlyWrong ? "review-exam" : "review-wrong"}">${onlyWrong ? "Show all questions" : "Show only the ones I missed"}</button></div>`;
  if (!items.length) html += `<div class="card"><p>You got every question right. Nothing to review!</p></div>`;
  items.forEach(({ q, i }) => {
    const ok = r.results[i];
    html += `<div class="card rv"><p class="rvhead ${ok ? "ok" : "no"}">${ok ? "✓ Correct" : (isAnswered(i) ? "✗ Not quite" : "✗ Not answered")} · Question ${i + 1} · ${pillLabel(q)}</p><p class="qtext">${q.q}</p><div class="ans" style="border:0;padding:0;margin:0"><b>Correct answer</b>${answerText(q)}</div><div class="explain"><b>Why</b>${q.e}</div></div>`;
  });
  mount(html, true);
}

/* ---------- interactions ---------- */
function choose(k) {
  const r = run, i = r.i, q = r.qs[i];
  if (r.screen !== "q" || r.checked[i]) return;
  if (q.type === "single") { r.ans[i] = k; r.touched[i] = true; if (r.mode === "practice") return check(); }
  else { const a = r.ans[i], ix = a.indexOf(k); if (ix >= 0) a.splice(ix, 1); else a.push(k); r.touched[i] = true; }
  renderQuestion();
}
function check() {
  const r = run, i = r.i, q = r.qs[i];
  r.checked[i] = true; r.results[i] = grade(i);
  recordMissed(q, r.results[i]); save();
  r.focusId = "next"; renderQuestion();
}
function moveItem(from, to, focusId) {
  const r = run, a = r.ans[r.i];
  if (from === to || to < 0 || to >= a.length) return;
  const x = a.splice(from, 1)[0]; a.splice(to, 0, x);
  r.touched[r.i] = true; r.focusId = focusId || null; renderQuestion();
}
function assign(k, j) {
  const r = run, a = r.ans[r.i], from = a.indexOf(j), prev = a[k];
  if (from >= 0) a[from] = (from !== k && prev !== null) ? prev : null;
  a[k] = j; r.sel = null; renderQuestion();
}
function unassign(j) { const r = run, a = r.ans[r.i]; a.forEach((x, idx) => { if (x === j) a[idx] = null; }); r.sel = null; renderQuestion(); }
function goTo(k) { run.i = k; run.sel = null; run.confirming = false; renderQuestion(true); }

app.addEventListener("click", e => {
  const t = e.target.closest("[data-topic],[data-fmt],[data-act],[data-k],[data-slot],[data-chip],[data-nav]");
  if (!t) return;
  const d = t.dataset;
  if (d.topic) { const tp = TOPICS[d.topic]; return startPractice(tp.title, shuffle(tp.qs.map(q => q.id)), "topic", tp.id); }
  if (d.fmt) return startPractice(FORMATS[d.fmt].name, shuffle(ALL.filter(q => q.type === d.fmt).map(q => q.id)).slice(0, 15), "format");
  if (d.k !== undefined) return choose(+d.k);
  if (d.nav !== undefined) return goTo(+d.nav);
  if (d.chip !== undefined) { run.sel = run.sel === +d.chip ? null : +d.chip; run.focusId = "c" + d.chip; return renderQuestion(); }
  if (d.slot !== undefined) {
    const r = run, k = +d.slot, a = r.ans[r.i];
    if (r.sel !== null) return assign(k, r.sel);
    if (a[k] !== null) { a[k] = null; return renderQuestion(); }
    return;
  }
  const act = d.act;
  if (act === "up") { const p = +d.pos; return moveItem(p, p - 1, p - 1 === 0 ? "d0" : "u" + (p - 1)); }
  if (act === "down") { const p = +d.pos, last = run.ans[run.i].length - 1; return moveItem(p, p + 1, p + 1 === last ? "u" + last : "d" + (p + 1)); }
  if (act === "home") home();
  else if (act === "check") check();
  else if (act === "flag") { run.flags[run.i] = !run.flags[run.i]; run.focusId = "flag"; renderQuestion(); }
  else if (act === "topics") { const el = document.getElementById("topics"); if (el) el.scrollIntoView({ behavior: "smooth" }); }
  else if (act === "next") { if (run.mode === "exam") goTo(run.i + 1); else if (run.i === run.qs.length - 1) finishPractice(); else { run.i++; renderQuestion(true); } }
  else if (act === "prev") goTo(run.i - 1);
  else if (act === "finish") { run.confirming = true; run.focusId = "cf"; renderQuestion(); }
  else if (act === "cancelfinish") { run.confirming = false; renderQuestion(); }
  else if (act === "confirmfinish") finishExam();
  else if (act === "exam") startExam();
  else if (act === "exam-result") renderExamResult();
  else if (act === "review-exam") renderReview(false);
  else if (act === "review-wrong") renderReview(true);
  else if (act === "mixed") startPractice("Mixed quiz", shuffle(ALL.map(q => q.id)).slice(0, 20), "mixed");
  else if (act === "review") startPractice("Missed questions", shuffle(store.missed.filter(id => QBYID[id])), "review");
  else if (act === "retrywrong") startPractice("Retry: missed questions", shuffle(run.wrongIds), "review");
  else if (act === "again") { const r = run; startPractice(r.title, shuffle(r.qs.map(q => q.id)), r.kind, r.topicId); }
});

/* drag and drop (mouse); tap and arrow buttons cover touch and keyboard */
app.addEventListener("dragstart", e => {
  if (!run || run.screen !== "q") return;
  const t = e.target.closest ? e.target.closest("[data-pos],[data-chip],[data-slot]") : null;
  if (!t || !t.draggable) return;
  if (t.tagName === "LI") run.drag = { t: "o", pos: +t.dataset.pos };
  else if (t.dataset.chip !== undefined) run.drag = { t: "c", chip: +t.dataset.chip };
  else if (t.dataset.slot !== undefined) { const c = run.ans[run.i][+t.dataset.slot]; if (c === null) return; run.drag = { t: "c", chip: c }; }
  e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", "x");
});
app.addEventListener("dragover", e => {
  if (!run || !run.drag) return;
  if (run.drag.t === "o" && e.target.closest("li[data-pos]")) e.preventDefault();
  if (run.drag.t === "c" && (e.target.closest("[data-slot]") || e.target.closest("[data-pool]"))) e.preventDefault();
});
app.addEventListener("drop", e => {
  if (!run || !run.drag) return;
  const d = run.drag; run.drag = null;
  if (d.t === "o") { const li = e.target.closest("li[data-pos]"); if (li) { e.preventDefault(); moveItem(d.pos, +li.dataset.pos); } }
  else { const s = e.target.closest("[data-slot]"), p = e.target.closest("[data-pool]"); if (s) { e.preventDefault(); assign(+s.dataset.slot, d.chip); } else if (p) { e.preventDefault(); unassign(d.chip); } }
});
app.addEventListener("dragend", () => { if (run) run.drag = null; });

document.getElementById("brand").addEventListener("click", () => home());
home();
</script>
</body>
</html>
